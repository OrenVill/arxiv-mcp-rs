[workspace]
resolver = "2"
members = [
    "crates/arxiv-core",
    "crates/arxiv-fetch",
    "crates/arxiv-convert",
    "crates/arxiv-store",
    "crates/arxiv-mcp",
    "crates/arxiv-mcp-rs",
]
default-members = ["crates/arxiv-mcp-rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
repository = "https://origin.cursor.com/oren/arxiv-mcp-rs"
authors = ["Oren Villaret"]
homepage = "https://cursor.com/codebase/oren/arxiv-mcp-rs"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "io-std", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
quick-xml = { version = "0.37", features = ["serialize"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
urlencoding = "2.1"
scraper = "0.23"
lopdf = "0.35"
pdf-extract = "0.8"
rmcp = { version = "3.9", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
